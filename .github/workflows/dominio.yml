# Pubblica la copia su cassaforte.gccodelab.it.
# Gira solo nel repo "cassaforte-app"; nel repo "cassaforte" (indirizzo github.io) viene saltato.
name: Pubblica su cassaforte.gccodelab.it

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'giannivicla74-jpg/cassaforte-app'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
