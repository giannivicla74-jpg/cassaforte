<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14313a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cassaforte</title>
<style>
:root{--bg:#f0f3f1;--card:#fff;--ink:#12222a;--mute:#62747b;--line:#dbe3e0;--soft:#eaf0ee;--acc:#14313a;--on:#fff;--brass:#b5842a;--bad:#b3261e;--glow:rgba(181,132,42,.14);--sh:0 1px 2px rgba(18,34,42,.06),0 6px 20px rgba(18,34,42,.06);--avl:38%;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b161b;--card:#14252c;--ink:#e8efed;--mute:#8da2a9;--line:#24383f;--soft:#1b3038;--acc:#d6a540;--on:#10191d;--brass:#d6a540;--bad:#ff8a80;--glow:rgba(214,165,64,.12);--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);--avl:34%;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(70rem 26rem at 50% -12rem,var(--glow),transparent 70%) no-repeat;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 24px}
h1{font-size:1.4rem;margin:0;letter-spacing:-.02em}
.mute{color:var(--mute)}.small{font-size:.8rem}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--brass)}
label{display:block;font-size:.82rem;font-weight:600;color:var(--mute);margin:14px 0 5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:10px;text-decoration:none;color:inherit;transition:border-color .15s,transform .05s,filter .15s}
.btn:hover{border-color:var(--brass)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{padding:7px 11px;font-size:.85rem}
.btn.d{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
#lock{max-width:400px;margin:10vh auto 0;padding:16px}
.lockcard{padding:30px 24px;text-align:center}
.lockcard form{text-align:left}
.lockcard p{margin:8px 0 6px;font-size:.92rem}
.logo,.mark{display:grid;place-items:center;background:var(--acc);color:var(--on);flex:none}
.logo{width:68px;height:68px;border-radius:22px;margin:0 auto 16px;box-shadow:0 10px 28px var(--glow)}
.logo svg{width:34px;height:34px}
.mark{width:42px;height:42px;border-radius:13px}.mark svg{width:22px;height:22px}
#lock .btn{width:100%;margin-top:18px;padding:12px}
#err{color:var(--bad);min-height:1.4em;margin-top:8px;font-size:.9rem}
header.bar{position:sticky;top:0;z-index:2;margin:0 -16px;padding:16px 16px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);width:18px;height:18px;pointer-events:none}
.search input{padding-left:40px}
ul{list-style:none;margin:8px 0;padding:0}
li.it{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:1.1rem;color:#fff;background:hsl(var(--h) 38% var(--avl));flex:none}
.meta{min-width:0}
li.it h2{font-size:1.05rem;margin:0;overflow-wrap:anywhere}
.u{color:var(--mute);font-size:.88rem;overflow-wrap:anywhere}
.pwbox{margin-top:12px;background:var(--soft);border-radius:10px;padding:9px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;overflow-wrap:anywhere}
.pwbox.none{font-family:inherit;letter-spacing:0;color:var(--mute);font-style:italic}
.note{margin-top:8px;font-size:.88rem;color:var(--mute);white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.empty{text-align:center;padding:56px 16px}
.empty .mark{margin:0 auto 14px;width:56px;height:56px;border-radius:18px}.empty .mark svg{width:28px;height:28px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);width:min(560px,94vw);padding:0;box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog form{padding:20px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acc);color:var(--on);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;font:inherit}
li.it{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 90%,var(--soft)))}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:999px;font-size:.85rem}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.tag{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mute);margin-left:6px;vertical-align:middle}
.tag.w{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.star{flex:none;margin-left:auto;border:0;background:transparent;color:var(--mute);padding:6px;border-radius:10px;display:grid}
.star.on{color:#e9a820}
.meter{height:6px;border-radius:99px;background:var(--soft);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;transition:width .2s,background .2s}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:500}.chk input{width:auto}
h3{font-size:.95rem;margin:20px 0 8px}
.pwbox{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pwbox span{min-width:0;overflow-wrap:anywhere}
.pwbox .btn{font-family:system-ui,sans-serif;letter-spacing:0;flex:none;padding:4px 10px}
.banner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.9rem}
.banner span{flex:1;min-width:200px}
details{margin-top:10px}
summary{cursor:pointer;font-size:.85rem;color:var(--mute);font-weight:600}
.gopts{display:grid;gap:10px;margin-top:10px}
.gopts .opts{display:flex;flex-wrap:wrap;gap:8px 16px}
.gopts .chk{margin:0}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--acc)}
</style>
</head>
<body>

<main id="lock">
  <div class="card lockcard">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/></svg></div>
    <h1>Cassaforte</h1>
    <p class="mute" id="lockMsg"></p>
    <form id="lockForm" autocomplete="off">
      <label for="mp">Password principale</label>
      <input id="mp" type="password" autocomplete="current-password" required>
      <div id="mp2w" class="hide">
        <label for="mp2">Ripeti la password principale</label>
        <input id="mp2" type="password" autocomplete="new-password">
      </div>
      <div id="err" role="alert"></div>
      <button class="btn p" id="lockBtn">Sblocca</button>
    </form>
  </div>
</main>

<div id="app" class="wrap hide">
  <header class="bar">
    <div class="row">
      <div class="brand grow"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/></svg></span><div><h1>Cassaforte</h1><div class="mute small" id="count"></div></div></div>
      <button class="btn s" id="bSet">Opzioni</button>
      <button class="btn s" id="bLock">Blocca</button>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="search grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Cerca account" aria-label="Cerca account"></div>
      <button class="btn p" id="bAdd">+ Aggiungi</button>
    </div>
  <div class="chips" id="chips"></div>
  </header>
  <div class="banner hide" id="bk"><span id="bkTxt"></span><button class="btn s p" id="bkNow">Esporta ora</button><button class="btn s" id="bkLater">Più tardi</button></div>
  <ul id="list"></ul>
  <input type="file" id="file" accept="application/json,.json" class="hide">
</div>

<dialog id="dlg">
  <form id="form" method="dialog" autocomplete="off">
    <h1 id="dlgT">Nuovo account</h1>
    <label for="fName">Servizio</label><input id="fName" required placeholder="es. Netflix">
    <label for="fUser">Utente o email</label><input id="fUser" autocapitalize="off">
    <label for="fPass">Password</label>
    <div class="row"><input id="fPass" class="grow" type="text" spellcheck="false"><button type="button" class="btn" id="bGen">Genera</button></div>
    <div class="meter"><i id="mBar"></i></div><div class="small mute" id="mTxt" style="margin-top:4px;min-height:1.2em"></div>
    <details id="gOpts"><summary>Opzioni generatore</summary>
      <div class="gopts">
        <label for="gLen" style="margin:0">Lunghezza: <b id="gLenV">20</b></label>
        <input type="range" id="gLen" min="8" max="40" value="20">
        <div class="opts">
          <label class="chk"><input type="checkbox" id="g_lower" checked> Minuscole</label>
          <label class="chk"><input type="checkbox" id="g_upper" checked> Maiuscole</label>
          <label class="chk"><input type="checkbox" id="g_num" checked> Numeri</label>
          <label class="chk"><input type="checkbox" id="g_sym" checked> Simboli</label>
        </div>
      </div>
    </details>
    <label for="fCat">Categoria</label>
    <select id="fCat"><option>Email</option><option>Social</option><option>Banca</option><option>Lavoro</option><option>Shopping</option><option>Altro</option></select>
    <label class="chk"><input type="checkbox" id="fFav"> Segna come preferito</label>
    <label for="fUrl">Indirizzo sito</label><input id="fUrl" type="url" placeholder="https://">
    <label for="fNote">Note</label><textarea id="fNote" rows="3"></textarea>
    <div class="row" style="margin-top:16px">
      <button type="button" class="btn d" id="bDel">Elimina</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="bCancel">Annulla</button>
      <button class="btn p" id="bSave">Salva</button>
    </div>
  </form>
</dialog>
<dialog id="dlgSet"><div style="padding:20px">
  <h1>Opzioni</h1>
  <h3>Backup</h3>
  <p class="mute small" id="bkInfo" style="margin:0 0 10px"></p>
  <div class="row"><button class="btn" id="bExport">Esporta backup</button><button class="btn" id="bImport">Importa backup</button></div>
  <h3>Password principale</h3>
  <form id="pwForm" autocomplete="off">
    <label for="pOld" style="margin-top:0">Password attuale</label><input id="pOld" type="password" autocomplete="current-password" required>
    <label for="pNew">Nuova password</label><input id="pNew" type="password" autocomplete="new-password" required>
    <label for="pNew2">Ripeti la nuova password</label><input id="pNew2" type="password" autocomplete="new-password" required>
    <p class="mute small">I backup esportati prima restano protetti dalla vecchia password.</p>
    <div id="pErr" role="alert" style="color:var(--bad);min-height:1.3em;font-size:.9rem"></div>
    <button class="btn p" style="margin-top:6px">Cambia password principale</button>
  </form>
  <div class="row" style="margin-top:18px"><span class="grow"></span><button class="btn" id="bSetClose">Chiudi</button></div>
</div></dialog>
<dialog id="dlgQ"><form id="fQ" method="dialog" style="padding:20px" autocomplete="off">
  <h1>Cambia password</h1>
  <div class="mute small" id="qS"></div>
  <label for="qPass">Nuova password</label>
  <div class="row"><input id="qPass" class="grow" type="text" spellcheck="false" required><button type="button" class="btn" id="qGen">Genera</button></div>
  <div class="meter"><i id="qBar"></i></div><div class="small mute" id="qTxt" style="margin-top:4px;min-height:1.2em"></div>
  <p class="mute small">Il generatore usa lunghezza e caratteri scelti nel modulo di modifica.</p>
  <div class="row" style="margin-top:12px"><span class="grow"></span><button type="button" class="btn" id="qCancel">Annulla</button><button class="btn p">Salva</button></div>
</form></dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s), enc=new TextEncoder(), dec=new TextDecoder();
const b64=b=>{let s='';new Uint8Array(b).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let key=null, salt=null, items=[], editId=null, shown=new Set(), lockT, clipT;

const getVault=()=>{try{return JSON.parse(localStorage.getItem('vault'))}catch{return null}};
async function derive(pw,s){
  const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function persist(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(items)));
  localStorage.setItem('vault',JSON.stringify({v:1,salt:b64(salt),iv:b64(iv),data:b64(ct)}));
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}

/* Blocco / sblocco */
function showLock(){
  const v=getVault(), nuovo=!v;
  $('#lockMsg').textContent=nuovo?'Crea una password principale. Non si può recuperare: se la dimentichi, i dati restano illeggibili.':'Inserisci la password principale per aprire i tuoi account.';
  $('#mp2w').classList.toggle('hide',!nuovo); $('#mp2').required=nuovo;
  $('#lockBtn').textContent=nuovo?'Crea cassaforte':'Sblocca';
  $('#mp').value=$('#mp2').value=''; $('#err').textContent='';
  $('#lock').classList.remove('hide'); $('#app').classList.add('hide');
}
function lock(){
  key=null;items=[];shown.clear();clearTimeout(lockT);
  ['dlg','dlgSet','dlgQ'].forEach(i=>{if($('#'+i).open)$('#'+i).close()});$('#pwForm').reset();$('#fQ').reset();$('#pErr').textContent='';
  showLock();
}
function bump(){clearTimeout(lockT);if(key)lockT=setTimeout(lock,2*60*1000)}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,bump,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&key)lock()});

$('#lockForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=$('#mp').value, v=getVault(), btn=$('#lockBtn'); $('#err').textContent='';
  btn.disabled=true;
  try{
    if(!v){
      if(pw.length<8){$('#err').textContent='Usa almeno 8 caratteri.';return}
      if(pw!==$('#mp2').value){$('#err').textContent='Le due password non coincidono.';return}
      salt=crypto.getRandomValues(new Uint8Array(16)); key=await derive(pw,salt); items=[]; await persist();
    }else{
      salt=unb64(v.salt); const k=await derive(pw,salt);
      try{
        const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.data));
        items=JSON.parse(dec.decode(pt)); key=k;
      }catch{$('#err').textContent='Password errata.';return}
    }
    $('#lock').classList.add('hide'); $('#app').classList.remove('hide'); render(); bump();
  }finally{btn.disabled=false}
});
$('#bLock').onclick=lock;

/* Elenco */
const ic=p=>`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={user:ic('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),key:ic('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>'),eye:ic('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),eyeoff:ic('<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6A16 16 0 0 0 2 12s4 7 10 7a9.7 9.7 0 0 0 4.2-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),link:ic('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),edit:ic('<path d="M4 20h4L19 9l-4-4L4 16z"/>')};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const CATS=['Email','Social','Banca','Lavoro','Shopping','Altro']; let cat='Tutti';
const star=f=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;
function strength(p){
  if(!p)return{p:0,t:'',c:'transparent'};
  let k=0;[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].forEach(r=>{if(r.test(p))k++});
  const n=Math.min(100,Math.min(p.length,16)*4+k*9);
  return n<40?{p:n,t:'Debole',c:'var(--bad)'}:n<70?{p:n,t:'Discreta',c:'#d99a1a'}:{p:n,t:'Forte',c:'#2f9e6b'};
}
function updMeter(){const r=strength($('#fPass').value);$('#mBar').style.width=r.p+'%';$('#mBar').style.background=r.c;$('#mTxt').textContent=r.t?'Robustezza: '+r.t:''}
$('#fPass').addEventListener('input',updMeter);
$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;render()});
function render(){
  const inCat=i=>cat==='Tutti'||(cat==='★'?i.fav:(i.cat||'Altro')===cat);
  if(!items.some(inCat))cat='Tutti';
  updBackup();
  const q=$('#q').value.trim().toLowerCase();
  $('#count').textContent=items.length===1?'1 account':items.length+' account';
  const chips=['Tutti',...(items.some(i=>i.fav)?['★']:[]),...CATS.filter(c=>items.some(i=>(i.cat||'Altro')===c))];
  $('#chips').innerHTML=items.length?chips.map(c=>`<button class="chip${c===cat?' on':''}" data-c="${c}">${c==='★'?'★ Preferiti':c}</button>`).join(''):'';
  const rows=items.filter(i=>inCat(i)&&(!q||[i.name,i.user,i.url].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||a.name.localeCompare(b.name,'it'));
  $('#list').innerHTML=rows.length?rows.map(i=>`
    <li class="it" data-id="${i.id}">
      <div class="top">
        <div class="av" style="--h:${hue(i.name)}">${esc(i.name.trim().charAt(0).toUpperCase())}</div>
        <div class="meta"><h2>${esc(i.name)}<span class="tag">${esc(i.cat||'Altro')}</span>${i.pass&&strength(i.pass).t==='Debole'?'<span class="tag w">Password debole</span>':''}</h2><div class="u">${esc(i.user)}</div></div>
        <button class="star${i.fav?' on':''}" data-a="fv" aria-label="${i.fav?'Rimuovi dai preferiti':'Aggiungi ai preferiti'}">${star(i.fav)}</button>
      </div>
      ${i.pass?`<div class="pwbox"><span>${shown.has(i.id)?esc(i.pass):'••••••••••'}</span><button class="btn s" data-a="qp">Cambia</button></div>`:`<div class="pwbox none"><span>Nessuna password salvata</span><button class="btn s" data-a="qp">Imposta</button></div>`}
      ${i.note?`<div class="note">${esc(i.note)}</div>`:''}
      <div class="acts">
        <button class="btn s" data-a="cu">${IC.user}Utente</button>
        <button class="btn s" data-a="cp">${IC.key}Password</button>
        <button class="btn s" data-a="sh">${shown.has(i.id)?IC.eyeoff+'Nascondi':IC.eye+'Mostra'}</button>
        ${i.url?`<a class="btn s" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${IC.link}Sito</a>`:''}
        <button class="btn s" data-a="ed">${IC.edit}Modifica</button>
      </div>
    </li>`).join(''):`<li class="empty mute"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/></svg></div>${items.length?'Nessun account corrisponde.':'Non hai ancora salvato nulla.<br>Premi <b>+ Aggiungi</b> per inserire il primo account.'}</li>`;
}
$('#q').addEventListener('input',render);
async function copy(t,m){
  try{await navigator.clipboard.writeText(t);toast(m);clearTimeout(clipT);
    clipT=setTimeout(()=>navigator.clipboard.writeText('').catch(()=>{}),30000)}
  catch{toast('Copia non riuscita')}
}
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]'); if(!b)return;
  const id=b.closest('li').dataset.id, it=items.find(x=>x.id===id); if(!it)return;
  const a=b.dataset.a;
  if(a==='cu')copy(it.user,'Utente copiato');
  if(a==='cp')copy(it.pass,'Password copiata (si cancella tra 30 s)');
  if(a==='sh'){shown.has(id)?shown.delete(id):shown.add(id);render()}
  if(a==='ed')openForm(it);
  if(a==='fv'){it.fav=!it.fav;persist().then(render)}
  if(a==='qp')openQuick(it);
});

/* Modulo */
function openForm(it){
  editId=it?it.id:null;
  $('#dlgT').textContent=it?'Modifica account':'Nuovo account';
  $('#fName').value=it?.name||'';$('#fUser').value=it?.user||'';$('#fPass').value=it?.pass||'';
  $('#fUrl').value=it?.url||'';$('#fNote').value=it?.note||'';$('#fCat').value=it?.cat||'Altro';$('#fFav').checked=!!it?.fav;
  $('#bDel').classList.toggle('hide',!it);
  updMeter();$('#dlg').showModal();
}
$('#bAdd').onclick=()=>openForm(null);
$('#bCancel').onclick=()=>$('#dlg').close();
$('#bGen').onclick=()=>{const g=gen();if(g){$('#fPass').value=g;updMeter()}};
$('#form').addEventListener('submit',async e=>{
  const d={name:$('#fName').value.trim(),user:$('#fUser').value.trim(),pass:$('#fPass').value,url:$('#fUrl').value.trim(),note:$('#fNote').value.trim(),cat:$('#fCat').value,fav:$('#fFav').checked};
  if(!d.name)return;
  if(editId){Object.assign(items.find(x=>x.id===editId),d)}
  else items.push({id:crypto.randomUUID(),...d});
  await persist(); render(); toast('Salvato');
});
$('#bDel').onclick=async()=>{
  if(!confirm('Eliminare questo account? L\u2019operazione non si può annullare.'))return;
  items=items.filter(x=>x.id!==editId); await persist(); $('#dlg').close(); render(); toast('Eliminato');
};

/* Backup: il file resta cifrato con la password principale */
$('#bExport').onclick=()=>{
  const v=localStorage.getItem('vault'); if(!v)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([v],{type:'application/json'}));
  a.download='cassaforte-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  localStorage.setItem('lastBackup',Date.now());updBackup();updBkInfo();toast('Backup esportato');
};
$('#bImport').onclick=()=>$('#file').click();
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f)return;
  try{
    const v=JSON.parse(await f.text());
    if(!(v.salt&&v.iv&&v.data))throw 0;
    if(!confirm('Importare il backup sostituirà tutti gli account attuali. Dovrai usare la password principale del backup. Continuare?'))return;
    localStorage.setItem('vault',JSON.stringify(v)); lock(); toast('Backup importato: sblocca con la sua password');
  }catch{toast('File di backup non valido')}
});

/* Generatore */
const SETS={lower:'abcdefghijkmnopqrstuvwxyz',upper:'ABCDEFGHJKLMNPQRSTUVWXYZ',num:'23456789',sym:'!@#$%^&*-_+=?'};
function rnd(n){const r=new Uint32Array(1),lim=Math.floor(2**32/n)*n;do{crypto.getRandomValues(r)}while(r[0]>=lim);return r[0]%n}
function gen(){
  const len=+$('#gLen').value, sel=Object.keys(SETS).filter(k=>$('#g_'+k).checked);
  if(!sel.length){toast('Scegli almeno un tipo di carattere');return''}
  const all=sel.map(k=>SETS[k]).join(''), out=sel.map(k=>SETS[k][rnd(SETS[k].length)]);
  while(out.length<len)out.push(all[rnd(all.length)]);
  for(let i=out.length-1;i>0;i--){const j=rnd(i+1);[out[i],out[j]]=[out[j],out[i]]}
  return out.slice(0,len).join('');
}
function saveG(){localStorage.setItem('gopts',JSON.stringify({len:+$('#gLen').value,lower:$('#g_lower').checked,upper:$('#g_upper').checked,num:$('#g_num').checked,sym:$('#g_sym').checked}))}
try{const o=JSON.parse(localStorage.getItem('gopts'));if(o){$('#gLen').value=o.len;['lower','upper','num','sym'].forEach(k=>$('#g_'+k).checked=!!o[k])}}catch{}
$('#gLenV').textContent=$('#gLen').value;
$('#gOpts').addEventListener('input',()=>{$('#gLenV').textContent=$('#gLen').value;saveG()});

/* Modifica rapida password */
let qId=null;
function updQ(){const r=strength($('#qPass').value);$('#qBar').style.width=r.p+'%';$('#qBar').style.background=r.c;$('#qTxt').textContent=r.t?'Robustezza: '+r.t:''}
function openQuick(it){qId=it.id;$('#qS').textContent=it.name+(it.user?' · '+it.user:'');$('#qPass').value='';updQ();$('#dlgQ').showModal()}
$('#qPass').addEventListener('input',updQ);
$('#qGen').onclick=()=>{const g=gen();if(g){$('#qPass').value=g;updQ()}};
$('#qCancel').onclick=()=>$('#dlgQ').close();
$('#fQ').addEventListener('submit',async()=>{
  const it=items.find(x=>x.id===qId); if(!it||!$('#qPass').value)return;
  it.pass=$('#qPass').value; await persist(); render(); toast('Password aggiornata');
});

/* Avviso di backup */
const DAY=864e5;
function updBackup(){
  const now=Date.now(); let since=+localStorage.getItem('vaultSince');
  if(!since){since=now;localStorage.setItem('vaultSince',now)}
  const last=+localStorage.getItem('lastBackup')||0, ref=last||since, snooze=+localStorage.getItem('bkSnooze')||0;
  const due=items.length>0&&now-ref>14*DAY&&now>snooze;
  $('#bk').classList.toggle('hide',!due);
  if(due){const d=Math.floor((now-ref)/DAY);
    $('#bkTxt').textContent=last?`L'ultimo backup risale a ${d} giorni fa. Esportane uno nuovo per non perdere i dati.`:'Non hai ancora esportato nessun backup. Ne basta uno per non perdere tutto se cambi telefono o cancelli i dati del browser.'}
}
function updBkInfo(){const l=+localStorage.getItem('lastBackup');$('#bkInfo').textContent=l?'Ultimo backup: '+new Date(l).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'}):'Nessun backup ancora esportato.'}
$('#bkNow').onclick=()=>$('#bExport').click();
$('#bkLater').onclick=()=>{localStorage.setItem('bkSnooze',Date.now()+3*DAY);updBackup()};

/* Opzioni e cambio password principale */
$('#bSet').onclick=()=>{updBkInfo();$('#pErr').textContent='';$('#dlgSet').showModal()};
$('#bSetClose').onclick=()=>$('#dlgSet').close();
$('#pwForm').addEventListener('submit',async e=>{
  e.preventDefault(); const err=$('#pErr'); err.textContent='';
  const o=$('#pOld').value, n=$('#pNew').value, v=getVault();
  if(n.length<8){err.textContent='La nuova password deve avere almeno 8 caratteri.';return}
  if(n!==$('#pNew2').value){err.textContent='Le due nuove password non coincidono.';return}
  const btn=e.submitter; if(btn)btn.disabled=true;
  try{
    try{const k=await derive(o,unb64(v.salt));await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.data))}
    catch{err.textContent='La password attuale non è corretta.';return}
    salt=crypto.getRandomValues(new Uint8Array(16)); key=await derive(n,salt); await persist();
    $('#pwForm').reset(); $('#dlgSet').close(); toast('Password principale cambiata');
  }finally{if(btn)btn.disabled=false}
});

showLock();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
